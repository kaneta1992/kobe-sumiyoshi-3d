<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>神戸・住吉山手 3D</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    system-ui,
                    'Hiragino Kaku Gothic ProN',
                    'Noto Sans JP',
                    sans-serif;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #0d1117;
                color: #e8edf2;
            }
            #app {
                position: fixed;
                inset: 0;
            }
            #app canvas {
                display: block;
                touch-action: none;
            }
            .panel {
                position: fixed;
                z-index: 10;
                padding: 6px 10px;
                border-radius: 6px;
                background: rgba(12, 16, 22, 0.62);
                font-size: 12px;
                line-height: 1.6;
                letter-spacing: 0.02em;
                pointer-events: none;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            }
            #status {
                top: 10px;
                left: 10px;
            }
            #help {
                bottom: 10px;
                left: 10px;
            }
            /* 出典表記は各データの利用条件（常時表示・非表示にしないこと）:
               地理院タイル = 出典明示、兵庫県 50cmメッシュ DSM/DEM = CC-BY 4.0 */
            #credit {
                right: 10px;
                bottom: 10px;
                max-width: min(46em, 70vw);
                text-align: right;
            }
            #credit a {
                color: #9fc7ff;
                pointer-events: auto;
            }
            #loading {
                position: fixed;
                inset: 0;
                z-index: 20;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                background: #0d1117;
                transition: opacity 0.5s ease;
            }
            #loading.hidden {
                opacity: 0;
                pointer-events: none;
            }
            #loading-title {
                font-size: 15px;
                letter-spacing: 0.08em;
            }
            #loading-track {
                width: min(420px, 70vw);
                height: 4px;
                border-radius: 2px;
                background: rgba(255, 255, 255, 0.14);
                overflow: hidden;
            }
            #loading-bar {
                width: 0%;
                height: 100%;
                background: #6fa8ff;
                transition: width 0.2s linear;
            }
            #loading-label {
                font-size: 12px;
                color: #a8b4c2;
            }
            /* タッチUI（src/ui/touch.ts が中身を作る）。タッチ端末でだけ表示される */
            #touch-ui {
                position: fixed;
                inset: 0;
                z-index: 15;
                pointer-events: none;
                user-select: none;
                -webkit-user-select: none;
            }
            #touch-ui.hidden {
                display: none;
            }
            #touch-ui .touch-stick,
            #touch-ui .touch-button {
                position: absolute;
                pointer-events: auto;
                touch-action: none;
                border-radius: 50%;
                border: 1px solid rgba(255, 255, 255, 0.3);
                background: rgba(12, 16, 22, 0.34);
                backdrop-filter: blur(2px);
            }
            /* 出典表記（常時表示が利用条件）と重ならないよう、操作系は下端から持ち上げる */
            #touch-ui .touch-stick,
            #touch-ui .touch-buttons {
                bottom: calc(env(safe-area-inset-bottom, 0px) + 118px);
            }
            #touch-ui .touch-stick {
                left: max(16px, env(safe-area-inset-left));
                width: 120px;
                height: 120px;
            }
            #touch-ui .touch-knob {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 50px;
                height: 50px;
                margin: -25px 0 0 -25px;
                border-radius: 50%;
                background: rgba(233, 240, 248, 0.5);
            }
            #touch-ui .touch-buttons {
                position: absolute;
                right: max(16px, env(safe-area-inset-right));
                display: flex;
                align-items: flex-end;
                gap: 10px;
            }
            #touch-ui .touch-button {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 68px;
                height: 68px;
                font-size: 12px;
                letter-spacing: 0.04em;
                color: #e8edf2;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            }
            #touch-ui .touch-button.active {
                background: rgba(111, 168, 255, 0.5);
            }
            #touch-ui .touch-button.disabled {
                opacity: 0.35;
            }
            #touch-ui .touch-button.hidden {
                display: none;
            }
            #touch-ui .touch-interact {
                width: 78px;
                height: 78px;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>

        <div id="status" class="panel">起動中…</div>
        <div id="help" class="panel">WASD: 移動　Shift: 走る　ドラッグ/マウス: 視点　F: 乗車　R: 位置リセット</div>
        <div id="credit" class="panel">
            出典:
            <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noreferrer">
                地理院タイル（国土地理院）
            </a><br />
            この作品は、以下の著作物を改変して利用しています。兵庫県 50cmメッシュ DSM/DEM（2021〜2022年度）、[兵庫県]（<a
                href="https://creativecommons.org/licenses/by/4.0/deed.ja"
                target="_blank"
                rel="noreferrer"
                >CC BY 4.0</a
            >）。建物高さ・地形・樹木は本アプリが上記データを加工して生成したもので、兵庫県が作成・公表したものではありません。
        </div>

        <div id="loading">
            <div id="loading-title">神戸市東灘区 住吉山手 2.4km四方</div>
            <div id="loading-track"><div id="loading-bar"></div></div>
            <div id="loading-label">初期化中…</div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
