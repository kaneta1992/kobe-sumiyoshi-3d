<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>神戸・住吉山手 3D</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    system-ui,
                    'Hiragino Kaku Gothic ProN',
                    'Noto Sans JP',
                    sans-serif;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #0d1117;
                color: #e8edf2;
            }
            #app {
                position: fixed;
                inset: 0;
            }
            #app canvas {
                display: block;
                touch-action: none;
            }
            .panel {
                position: fixed;
                z-index: 10;
                padding: 6px 10px;
                border-radius: 6px;
                background: rgba(12, 16, 22, 0.62);
                font-size: 12px;
                line-height: 1.6;
                letter-spacing: 0.02em;
                pointer-events: none;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            }
            #status {
                top: 10px;
                left: 10px;
                /* 右上のマルチプレイ表示と重ならないよう、手前で折り返す */
                max-width: min(64em, 68vw);
            }
            /* 狭い画面では右上のミニマップ（116px）の下に潜り込ませない（E50） */
            @media (max-width: 700px) {
                #status {
                    max-width: 56vw;
                }
            }
            #help {
                bottom: 10px;
                left: 10px;
            }
            /* マルチプレイの接続人数（契約05）。中身が無いときは枠ごと出さない */
            #net {
                top: 10px;
                right: 10px;
                text-align: right;
            }
            #net:empty {
                display: none;
            }
            /* 出典表記は各データの利用条件（常時表示・非表示にしないこと）:
               地理院タイル = 出典明示、兵庫県 50cmメッシュ DSM/DEM = CC-BY 4.0 */
            #credit {
                right: 10px;
                bottom: 10px;
                max-width: min(46em, 70vw);
                text-align: right;
            }
            #credit a {
                color: #9fc7ff;
                pointer-events: auto;
            }
            #loading {
                position: fixed;
                inset: 0;
                z-index: 20;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                background: #0d1117;
                transition: opacity 0.5s ease;
            }
            #loading.hidden {
                opacity: 0;
                pointer-events: none;
            }
            #loading-title {
                font-size: 15px;
                letter-spacing: 0.08em;
            }
            #loading-track {
                width: min(420px, 70vw);
                height: 4px;
                border-radius: 2px;
                background: rgba(255, 255, 255, 0.14);
                overflow: hidden;
            }
            #loading-bar {
                width: 0%;
                height: 100%;
                background: #6fa8ff;
                transition: width 0.2s linear;
            }
            #loading-label {
                font-size: 12px;
                color: #a8b4c2;
            }
            /* ミニマップ + 全体マップ（src/ui/map.ts が中身を作る・契約09）。
               右上のマルチプレイ表示の下に置く。モバイルではタッチUI（左下スティック・
               右下ボタン）と重ならないよう、上端側だけを使う（E50） */
            #minimap {
                position: fixed;
                z-index: 12;
                top: calc(env(safe-area-inset-top, 0px) + 40px);
                right: max(10px, env(safe-area-inset-right, 0px));
                width: 168px;
                height: 168px;
                border-radius: 50%;
                overflow: hidden;
                cursor: pointer;
                touch-action: none;
                border: 2px solid rgba(255, 255, 255, 0.55);
                box-shadow: 0 3px 12px rgba(0, 0, 0, 0.42);
                background: #f7f2e6;
                transition: opacity 0.15s ease;
            }
            #minimap canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            /* 全体マップを開いている間は引っ込める */
            #minimap.dimmed {
                opacity: 0;
                pointer-events: none;
            }
            @media (max-width: 700px), (max-height: 560px) {
                #minimap {
                    width: 116px;
                    height: 116px;
                }
            }
            #map-full {
                position: fixed;
                inset: 0;
                z-index: 25;
                background: #dcd6c8;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
            }
            #map-full.hidden {
                display: none;
            }
            #map-full canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            #map-full .map-close,
            #map-full .map-hint {
                position: absolute;
                border-radius: 8px;
                background: rgba(12, 16, 22, 0.72);
                color: #e8edf2;
                font-size: 13px;
            }
            #map-full .map-close {
                top: max(12px, env(safe-area-inset-top, 0px));
                right: max(12px, env(safe-area-inset-right, 0px));
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                font-size: 18px;
                cursor: pointer;
                touch-action: none;
            }
            #map-full .map-hint {
                left: 50%;
                bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
                transform: translateX(-50%);
                padding: 6px 12px;
                white-space: nowrap;
                pointer-events: none;
            }
            /* タッチUI（src/ui/touch.ts が中身を作る）。タッチ端末でだけ表示される */
            #touch-ui {
                position: fixed;
                inset: 0;
                z-index: 15;
                pointer-events: none;
                user-select: none;
                -webkit-user-select: none;
            }
            #touch-ui.hidden {
                display: none;
            }
            #touch-ui .touch-stick,
            #touch-ui .touch-button {
                position: absolute;
                pointer-events: auto;
                touch-action: none;
                border-radius: 50%;
                border: 1px solid rgba(255, 255, 255, 0.3);
                background: rgba(12, 16, 22, 0.34);
                backdrop-filter: blur(2px);
            }
            /* 出典表記（常時表示が利用条件）と重ならないよう、操作系は下端から持ち上げる */
            #touch-ui .touch-stick,
            #touch-ui .touch-buttons {
                bottom: calc(env(safe-area-inset-bottom, 0px) + 118px);
            }
            #touch-ui .touch-stick {
                left: max(16px, env(safe-area-inset-left));
                width: 120px;
                height: 120px;
            }
            #touch-ui .touch-knob {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 50px;
                height: 50px;
                margin: -25px 0 0 -25px;
                border-radius: 50%;
                background: rgba(233, 240, 248, 0.5);
            }
            #touch-ui .touch-buttons {
                position: absolute;
                right: max(16px, env(safe-area-inset-right));
                display: flex;
                align-items: flex-end;
                gap: 10px;
            }
            #touch-ui .touch-button {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 68px;
                height: 68px;
                font-size: 12px;
                letter-spacing: 0.04em;
                color: #e8edf2;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            }
            #touch-ui .touch-button.active {
                background: rgba(111, 168, 255, 0.5);
            }
            #touch-ui .touch-button.disabled {
                opacity: 0.35;
            }
            #touch-ui .touch-button.hidden {
                display: none;
            }
            #touch-ui .touch-interact {
                width: 78px;
                height: 78px;
            }
            /* マッチUI（src/match/hud.ts が中身を作る・契約10）。
               ?match のときだけ生成される。3D の上・全体マップの下に置く */
            #match-ui {
                position: fixed;
                inset: 0;
                z-index: 18;
                pointer-events: none;
            }
            /* 安置の外にいる間の赤い縁。減速していることを画で伝える */
            #match-ui .match-vignette {
                position: absolute;
                inset: 0;
                opacity: 0;
                transition: opacity 0.35s ease;
                background: radial-gradient(
                    ellipse at center,
                    rgba(220, 40, 40, 0) 48%,
                    rgba(206, 32, 32, 0.42) 100%
                );
            }
            #match-ui .match-top {
                position: absolute;
                top: calc(env(safe-area-inset-top, 0px) + 8px);
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                /* 左上の #status・右上のミニマップと取り合わない幅に収める（E50） */
                max-width: min(44em, 62vw);
                text-align: center;
            }
            #match-ui .match-status {
                padding: 5px 12px;
                border-radius: 999px;
                background: rgba(12, 16, 22, 0.66);
                font-size: 12px;
                letter-spacing: 0.03em;
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 100%;
            }
            #match-ui .match-news {
                padding: 7px 16px;
                border-radius: 10px;
                background: rgba(24, 58, 110, 0.78);
                border: 1px solid rgba(140, 195, 255, 0.5);
                font-size: 14px;
                font-weight: 600;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            }
            #match-ui .match-news.pop {
                animation: match-pop 0.35s ease-out;
            }
            @keyframes match-pop {
                from {
                    transform: scale(0.86);
                    opacity: 0;
                }
                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }
            #match-ui .match-channel {
                position: absolute;
                left: 50%;
                bottom: calc(env(safe-area-inset-bottom, 0px) + 26%);
                transform: translateX(-50%);
                width: min(340px, 74vw);
                text-align: center;
            }
            #match-ui .match-channel-fill {
                height: 12px;
                width: 0%;
                border-radius: 999px;
                background: linear-gradient(90deg, #ffd257, #ff9a3c);
                box-shadow: 0 0 0 2px rgba(12, 16, 22, 0.7);
                transition: width 0.08s linear;
            }
            #match-ui .match-channel-label {
                margin-top: 6px;
                font-size: 12px;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
            }
            #match-ui .match-panel {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                pointer-events: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                padding: 22px 26px;
                border-radius: 14px;
                width: min(440px, 86vw);
                background: rgba(12, 16, 22, 0.9);
                border: 1px solid rgba(255, 255, 255, 0.14);
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
                text-align: center;
            }
            #match-ui .match-panel-title {
                font-size: 19px;
                font-weight: 700;
                letter-spacing: 0.04em;
            }
            #match-ui .match-panel-line {
                font-size: 13px;
                line-height: 1.7;
                color: #c6d0dc;
            }
            #match-ui .match-panel-button {
                margin-top: 6px;
                padding: 10px 26px;
                border: 0;
                border-radius: 999px;
                background: #3f7ad6;
                color: #ffffff;
                font: inherit;
                font-size: 15px;
                font-weight: 700;
                cursor: pointer;
            }
            #match-ui .match-panel-button:hover {
                background: #5a92e8;
            }
            #match-ui .match-panel-note {
                font-size: 12px;
                color: #93a1b2;
            }
            #match-ui .hidden {
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>

        <div id="status" class="panel">起動中…</div>
        <div id="net" class="panel"></div>
        <div id="help" class="panel">WASD: 移動　Shift: 走る　ドラッグ/マウス: 視点　F: 乗車　R: 位置リセット</div>
        <div id="credit" class="panel">
            出典:
            <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noreferrer">
                地理院タイル（国土地理院）
            </a><br />
            この作品は、以下の著作物を改変して利用しています。兵庫県 50cmメッシュ DSM/DEM（2021〜2022年度）、[兵庫県]（<a
                href="https://creativecommons.org/licenses/by/4.0/deed.ja"
                target="_blank"
                rel="noreferrer"
                >CC BY 4.0</a
            >）。建物高さ・地形・樹木は本アプリが上記データを加工して生成したもので、兵庫県が作成・公表したものではありません。
        </div>

        <div id="loading">
            <div id="loading-title">神戸市東灘区 住吉山手 2.4km四方</div>
            <div id="loading-track"><div id="loading-bar"></div></div>
            <div id="loading-label">初期化中…</div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
