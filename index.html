<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>神戸・住吉山手 3D</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    system-ui,
                    'Hiragino Kaku Gothic ProN',
                    'Noto Sans JP',
                    sans-serif;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #0d1117;
                color: #e8edf2;
            }
            #app {
                position: fixed;
                inset: 0;
            }
            #app canvas {
                display: block;
                touch-action: none;
            }
            .panel {
                position: fixed;
                z-index: 10;
                padding: 6px 10px;
                border-radius: 6px;
                background: rgba(12, 16, 22, 0.62);
                font-size: 12px;
                line-height: 1.6;
                letter-spacing: 0.02em;
                pointer-events: none;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            }
            #status {
                top: 10px;
                left: 10px;
            }
            #help {
                bottom: 10px;
                left: 10px;
            }
            /* 地理院タイルの出典表記は利用条件（常時表示・非表示にしないこと） */
            #credit {
                right: 10px;
                bottom: 10px;
            }
            #credit a {
                color: #9fc7ff;
                pointer-events: auto;
            }
            #loading {
                position: fixed;
                inset: 0;
                z-index: 20;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                background: #0d1117;
                transition: opacity 0.5s ease;
            }
            #loading.hidden {
                opacity: 0;
                pointer-events: none;
            }
            #loading-title {
                font-size: 15px;
                letter-spacing: 0.08em;
            }
            #loading-track {
                width: min(420px, 70vw);
                height: 4px;
                border-radius: 2px;
                background: rgba(255, 255, 255, 0.14);
                overflow: hidden;
            }
            #loading-bar {
                width: 0%;
                height: 100%;
                background: #6fa8ff;
                transition: width 0.2s linear;
            }
            #loading-label {
                font-size: 12px;
                color: #a8b4c2;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>

        <div id="status" class="panel">起動中…</div>
        <div id="help" class="panel">ドラッグ: 視点回転　WASD: 移動　Space/C: 上下　Shift: 加速　ホイール: 速度</div>
        <div id="credit" class="panel">
            出典:
            <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noreferrer">
                地理院タイル（国土地理院）
            </a>
        </div>

        <div id="loading">
            <div id="loading-title">神戸市東灘区 住吉山手 2.4km四方</div>
            <div id="loading-track"><div id="loading-bar"></div></div>
            <div id="loading-label">初期化中…</div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
